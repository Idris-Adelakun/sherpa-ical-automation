[project]
name = "sherpa-ical-automation"
version = "0.1.0"
description = "Export Sherpa Online tutoring bookings to an iCalendar file or local feed"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
sync = ["playwright>=1.64,<2"]

[project.scripts]
sherpa-ical-automation = "sherpa_ical_automation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
