name: Windows smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install in a Windows virtual environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install ".[icloud-windows]"
      - name: Exercise Windows Task Scheduler and the calendar feed
        run: .\.venv\Scripts\python.exe tests/windows_smoke.py
